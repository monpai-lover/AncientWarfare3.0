name: Package and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Package and verify installation files
        run: python3 scripts/package_release.py --tag "$GITHUB_REF_NAME" --output artifacts
      - name: Publish release and installation archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/AncientWarfare3-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "Ancient Warfare 3 ${GITHUB_REF_NAME}" \
            --notes-file artifacts/RELEASE-NOTES.md \
            --latest
